sessions:
  - title: "Java roadmap and the role of Java community"
    description: "An exploration of the future trajectory of Java, examining potential advancements in language features, libraries, platform capabilities, and the vital role community plays in shaping Java's direction."
    speakers: ["pravemoh", "ram-bgl"]
    tags: ["java", "keynote", "community", "roadmap"]
    year: 2024
    archiveUrl: "/2024/sessions/index.html"

  - title: "From Java Sourcecode to Bytecode - Secrets Unveiled!"
    description: "An exploration of bytecode, the secret language powering Java execution, and the transformation of source code (.java) into bytecode (.class) files — the heart of the Java Virtual Machine."
    speakers: ["tejeshr"]
    tags: ["java", "jvm", "bytecode", "core-java"]
    year: 2024
    archiveUrl: "/2024/sessions/index.html"

  - title: "Day in a life of modern Java developer"
