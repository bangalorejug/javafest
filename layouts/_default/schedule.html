{{ define "main" }}
<main class="container-xxl bd-gutter">
    <div class="container py-5">
        <h1 class="text-center mb-3">{{ .Title }}</h1>
        <div class="text-center text-muted mb-5">{{ .Content }}</div>
    </div>
</main>
<style>
    .conference-schedule {
        min-width: 1000px;
        margin-bottom: 0;
    }

    .conference-schedule th:first-child,
    .conference-schedule td:nth-child(2) {
        white-space: nowrap;
    }

    .schedule-session-cell {
        display: flex;
        align-items: center;
        gap: 1rem;
    }

    .schedule-keynote-cell {
        justify-content: center;
    }

    .schedule-keynote-cell .schedule-speakers,
    .schedule-keynote-cell .schedule-session-title {
        flex: 0 0 auto;
    }

    .schedule-session-title {
        flex: 1 1 auto;
        min-width: 0;
    }

    .schedule-speakers {
        display: flex;
        flex: 0 0 40%;
        flex-direction: column;
        align-items: flex-start;
        gap: 0.35rem;
    }

    .schedule-speaker {
        display: flex;
        align-items: center;
        gap: 0.25rem;
        min-width: 0;
        font-size: 0.8rem;
    }

    .schedule-speaker img {
        flex: 0 0 28px;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        object-fit: cover;
    }

    .schedule-speaker span {
        min-width: 0;
    }

    @media (max-width: 767.98px) {
        .table-responsive {
            overflow-x: visible;
        }

        .conference-schedule {
            display: block;
            min-width: 0;
        }

        .conference-schedule thead {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .conference-schedule tbody {
            display: block;
        }

        .conference-schedule tbody tr {
            display: grid;
            grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
            margin-bottom: 0.75rem;
            overflow: hidden;
            border: 1px solid var(--bs-border-color);
            border-radius: 0.5rem;
        }

        .conference-schedule tbody th,
        .conference-schedule tbody td {
            display: block;
            min-width: 0;
            padding: 0.75rem;
            white-space: normal;
            background: var(--bs-body-bg);
            box-shadow: none;
        }

        .conference-schedule tbody th::before,
        .conference-schedule tbody td:nth-child(2)::before {
            display: block;
            margin-bottom: 0.25rem;
            color: var(--bs-secondary-color);
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .conference-schedule tbody th::before {
            content: "Time (IST)";
        }

        .conference-schedule tbody td:nth-child(2)::before {
            content: "Duration";
        }

        .conference-schedule tbody td:nth-child(n + 3) {
            grid-column: 1 / -1;
            border-top: 1px solid var(--bs-border-color);
        }

        .conference-schedule tbody td:nth-child(3):not([colspan])::before,
        .conference-schedule tbody td:nth-child(4):not([colspan])::before,
        .conference-schedule tbody td:nth-child(5):not([colspan])::before,
        .conference-schedule tbody td[colspan="3"]::before {
            display: block;
            margin-bottom: 0.35rem;
            color: var(--bs-secondary-color);
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .conference-schedule tbody td:nth-child(3):not([colspan])::before {
            content: "Core";
        }

        .conference-schedule tbody td:nth-child(4):not([colspan])::before {
            content: "Enterprise";
        }

        .conference-schedule tbody td:nth-child(5):not([colspan])::before {
            content: "DevOps";
        }

        .conference-schedule tbody td[colspan="3"]::before {
            content: "All tracks";
        }

        .schedule-session-cell {
            display: block;
        }

        .schedule-speakers {
            margin-bottom: 0.5rem;
            align-items: center;
        }

        .schedule-session-title {
            display: block;
        }
    }
</style>
{{ end }}
