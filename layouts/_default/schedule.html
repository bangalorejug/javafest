{{ define "main" }}
<main class="container-xxl bd-gutter">
    <div class="container py-5">
        <h1 class="text-center mb-3">{{ .Title }}</h1>
        <div class="text-center text-muted mb-5">{{ .Content }}</div>
    </div>
</main>
<style>
    .conference-schedule {
        min-width: 1000px;
        margin-bottom: 0;
    }

    .conference-schedule th:first-child,
    .conference-schedule td:nth-child(2) {
        white-space: nowrap;
    }

    .schedule-session-cell {
        display: flex;
        align-items: center;
        gap: 1rem;
    }

    .schedule-keynote-cell {
        justify-content: center;
    }

    .schedule-keynote-cell .schedule-speakers,
    .schedule-keynote-cell .schedule-session-title {
        flex: 0 0 auto;
    }

    .schedule-session-title {
        flex: 1 1 auto;
        min-width: 0;
    }

    .schedule-speakers {
        display: flex;
        flex: 0 0 40%;
        flex-direction: column;
        align-items: flex-start;
        gap: 0.35rem;
    }

    .schedule-speaker {
        display: flex;
        align-items: center;
        gap: 0.25rem;
        min-width: 0;
        font-size: 0.8rem;
    }

    .schedule-speaker img {
        flex: 0 0 28px;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        object-fit: cover;
    }

    .schedule-speaker span {
        min-width: 0;
    }
</style>
{{ end }}
